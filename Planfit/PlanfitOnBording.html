<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planfit OnBording</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- 진행률 바 -->
    <div class="progress-container">
        <div id="progress"></div>
    </div>
    
    <div class="slider">

        <!-- 화면1 -->
        <section class="screen active" id="screen1">
            <h1 class="logo">Planfit</h1>
        </section>

        <!-- 화면2 -->
        <section class="screen" id="screen2">
            <div class="content">
                <h2>
                    운동 고민 끝,<br>
                    플랜핏에 오신 것을<br>
                    환영합니다!
                </h2>

                <button class="kakao-btn">
                    카카오로 계속하기
                </button>
            </div>
        </section>

        <!-- 화면3 -->
        <section class="screen" id="screen3">
            <div class="content">
                <h2>운동 수준이 어떻게 되시나요?</h2>

                <button class="option">입문</button>
                <button class="option">초급</button>
                <button class="option">중급</button>
                <button class="option">고급</button>
                <button class="option">전문가</button>
            </div>
        </section>

    </div>
    
    <script src="./app.js"></script>
    
</body>
</html>
