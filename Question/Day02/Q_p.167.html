<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>프런트엔드 개발자 지원서 작성 웹</title>
    </head>
    <body>
        <h2>프런트엔드 개발자 지원서</h2>
        <p>HTML, CSS, 자바스크립트의 기술을 이해하고 실무 경험이 있는 분을 찾습니다.</p>

        <hr>

        <form>
            <dl>
                <dt><b>개인정보</b></dt><br>
                <dd>
                    <label for="r-name">이름</label>
                    <input type="username" id="r-name">
                </dd>
                <dd>
                    <label for="r-phone">연락처</label>
                    <input type="number" id="r-phone">
                </dd>
            </dl>

            <p><b>지원 분야</b></p>

            <ul>
                <li>웹 퍼블리싱</li>
                <li>웹 애플리케이션 개발</li>
                <li>개발 환경 개선</li>
            </ul>
            <p><b>지원 동기</b></p>

            <textarea cols="60" rows="5"></textarea><br>
            <input type="submit" value="접수하기">
            <input type="reset" value="다시 쓰기">
        </form>
    </body>
</html>
