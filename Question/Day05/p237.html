<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>p237</title>

        <style>
            table{
                width: 550px;
                border-collapse: collapse;
                text-align: center;
            }

            th, td {
                border: 1px solid black;
                padding: 10px;
            }

            /* 왼쪽 제목 셀 */
            .title-cell {
                font-weight: bold;
            }

            /* 2022년 열 색상 */
            .highlight {
                background-color: #e5f6f6;
            }

            /* 캡션 */
            caption {
                caption-side: bottom;
                text-align: right;
            }
        </style>
    </head>
    <body>
        <table>

            <!-- 캡션 -->
            <caption>출처: 통계청 100대 지표</caption>

            <!-- 1행 -->
            <tr>
                <th class="title-cell">지수</th>
                <th>2019년</th>
                <th>2020년</th>
                <th>2021년</th>
                <th class="highlight">2022년</th>
            </tr>

            <!-- 2행 -->
            <tr>
                <th class="title-cell">가구 수</th>
                <td>20,891,348</td>
                <td>21,484,785</td>
                <td>22,022,753</td>
                <td class="highlight">22,383,187</td>
            </tr>

            <!-- 3행 -->
            <tr>
                <th class="title-cell">1인 가구 수</th>
                <td>6,145,516</td>
                <td>6,643,354</td>
                <td>7,165,788</td>
                <td class="highlight">7,502,350</td>
            </tr>
        </table>
    </body>
</html>
