<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>p238</title>
        <style>
            h2{text-align: center; color: #ff0000; font-size: 1.5em;}
            p{font-size: 1.2em; text-align: center; font-weight: bold;}
            span.accent{color: #0000ff;}
            span.smalltext{font-size: 0.7em; text-align: center;}
            p.look{font-size: 1.0em; color: white; background-color: black;}
        </style>
    </head>
    <body>
        <fieldset>
        <p class="look">확인하세요</p>

        <h2>주문 및 배송</h2>
        <p><span class="accent">오후 2시 이전</span>주문건은 당일 발송합니다</p>
        <p>2시 이후 주문건은 다음날 발송합니다(주말 제외)</p>

        <hr>

        <h2>교환 및 환불</h2>

        <p>불만족시<span class="accent">100% 환불</span>해 드립니다</p>
        <p>고객센터로 전화주세요</p>

        <hr>

        <h2>고객센터</h2>

        <p>0000-0000</p>

        <p><span class="smalltext">상담시간 : 오전9시 ~ 오후 6시 (토/일, 공휴일 휴무)</span></p>
        </fieldset>
    </body>
</html>
